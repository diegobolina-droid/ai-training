<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="layout">
    <main id="messages" class="messages" role="log" aria-live="polite"></main>
    <div id="error-feedback" class="error-feedback" aria-live="polite" hidden></div>
    <form id="chat-form" class="input-form">
      <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off" aria-label="Message">
      <button type="submit" id="send-btn">Send</button>
    </form>
  </div>
  <script src="/app.js" defer></script>
</body>
</html>
