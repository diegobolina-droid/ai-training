<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Migration Chat</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main id="messages" class="messages" aria-live="polite"></main>
  <form id="chat-form" class="input-form">
    <input type="text" id="message-input" placeholder="e.g. Migrate Express to FastAPI" autocomplete="off">
    <textarea id="code-input" placeholder="Paste your code here (optional)" rows="4"></textarea>
    <button type="submit" id="send-btn">Send</button>
  </form>
  <div id="error-feedback" class="error-feedback" aria-live="polite"></div>
  <script src="/app.js" defer></script>
</body>
</html>
